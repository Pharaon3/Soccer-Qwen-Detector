# Video / sampling — keep aligned with train_config.yaml for fine-tuned inference
video:
  fps: 25
  clip_seconds: 30
  sample_fps: 2
  max_frames: 32
  max_image_side: 896

qwen:
  backend: "hf"
  model_id: "Qwen/Qwen2.5-VL-7B-Instruct"
  adapter_path: "checkpoints/qwen_lora"
  torch_dtype: "bfloat16"
  temperature: 0.2
  max_tokens: 4096
  processor:
    max_pixels: 401408
  base_url: "http://localhost:8000/v1"
  api_key: "EMPTY"
  model_name: "Qwen/Qwen2.5-VL-72B-Instruct"
  timeout_sec: 600

postprocess:
  output_fps: 25
  min_gap_sec:
    pass: 0.8
    pass_received: 0.8
    recovery: 1.0
    tackle: 1.2
    interception: 1.0
    ball_out_of_play: 3.0
    clearance: 1.0
    take_on: 1.2
    substitution: 5.0
    block: 1.0
    aerial_duel: 1.0
    shot: 2.0
    save: 2.0
    foul: 2.0
    goal: 5.0

# Fine-tune Qwen2.5-VL on dataset/<clip_id>/ JSON + video
# ~32GB GPU: keep max_frames <= 40 (240 frames OOMs — vision tokens scale with frame count)

dataset_root: "dataset"
annotator_dir_name: "annotator"
checkpoint_dir: "checkpoints/qwen_lora"

duration_sec: 30.0

video:
  fps: 25
  clip_seconds: 30
  sample_fps: 2                # frames per second of clip timeline to sample
  max_frames: 60               # 60 @ 8fps ≈ full 30s; use 32 for first 16s if VRAM allows
  max_image_side: 896          # downscale 1080p before processor (1280 uses more VRAM)

val_ratio: 0.15
seed: 42
max_clips: 0

qwen:
  model_id: "Qwen/Qwen2.5-VL-7B-Instruct"
  use_lora: true
  lora_r: 8                    # 8 uses less VRAM than 16; raise if underfitting
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  torch_dtype: "bfloat16"
  load_in_4bit: false          # set true + pip install bitsandbytes if still OOM
  gradient_checkpointing: true
  use_flash_attention: true    # pip install flash-attn (optional, saves VRAM)
  processor:
    max_pixels: 401408         # cap vision tokens per frame (~896*896/2 scale)

training:
  epochs: 10
  batch_size: 1
  gradient_accumulation_steps: 8
  lr: 0.00002
  weight_decay: 0.01
  max_grad_norm: 1.0
  save_every_epochs: 1
  keep_last_n_checkpoints: 2
  log_every_steps: 4

inference:
  thresholds:
    pass: 0.4
    pass_received: 0.4
    recovery: 0.4
    tackle: 0.35
    interception: 0.35
    ball_out_of_play: 0.35
    clearance: 0.35
    take_on: 0.35
    substitution: 0.25
    block: 0.35
    aerial_duel: 0.35
    shot: 0.3
    save: 0.3
    foul: 0.3
    goal: 0.2
  min_gap_sec:
    pass: 0.8
    pass_received: 0.8
    recovery: 1.0
    tackle: 1.2
    interception: 1.0
    ball_out_of_play: 3.0
    clearance: 1.0
    take_on: 1.2
    substitution: 5.0
    block: 1.0
    aerial_duel: 1.0
    shot: 2.0
    save: 2.0
    foul: 2.0
    goal: 5.0
